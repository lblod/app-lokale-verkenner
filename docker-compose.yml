x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  identifier:
    image: semtech/mu-identifier:1.11.0
    environment:
      SESSION_COOKIE_SECURE: "on"
    labels:
      - "logging=true"
    logging: *default-logging

  dispatcher:
    image: semtech/mu-dispatcher:2.1.1
    volumes:
      - ./config/dispatcher:/config
    labels:
      - "logging=true"
    logging: *default-logging

  frontend:
    image: lblod/frontend-lokale-verkenner:0.0.2
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  # Your extra services here
  resource:
    image: semtech/mu-cl-resources:1.27.2
    volumes:
      - ./config/resources:/config
    labels:
      - "logging=true"
    logging: *default-logging

  migrations:
    image: semtech/mu-migrations-service:0.9.0
    links:
      - triplestore:database
    environment:
      MU_SPARQL_TIMEOUT: 600
    volumes:
      - ./config/migrations:/data/migrations
    labels:
      - "logging=true"
    logging: *default-logging

  delta-notifier:
    image: semtech/mu-delta-notifier:0.4.0
    volumes:
      - ./config/delta:/config/
    labels:
      - "logging=true"
    logging: *default-logging

  database:
    image: semtech/sparql-parser:0.0.15
    volumes:
      - ./config/authorization/:/config/
      - ./data/authorization/:/data/
    labels:
      - "logging=true"
    logging: *default-logging

  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
    volumes:
      - ./data/db:/data
      - ./config/virtuoso/virtuoso.ini:/data/virtuoso.ini
    labels:
      - "logging=true"
    logging: *default-logging

  login:
    image: lblod/acmidm-login-service:0.12.1.rc-2
    environment:
      MU_APPLICATION_AUTH_USERID_CLAIM: ""
      MU_APPLICATION_GRAPH: ""
      MU_APPLICATION_AUTH_ROLE_CLAIM: ""
      MU_APPLICATION_AUTH_DISCOVERY_URL: ""
      MU_APPLICATION_AUTH_CLIENT_ID: ""
      MU_APPLICATION_AUTH_REDIRECT_URI: ""
      MU_APPLICATION_AUTH_CLIENT_SECRET: ""
      ORGANIZATION_TYPE: "http://www.w3.org/ns/org#Organization"
      GROUP_TYPE_LABEL: "organizations"

  accountdetail:
    image: lblod/account-detail-service:0.1.0
    labels:
      - "logging=true"
    environment:
      MU_APPLICATION_GRAPH: "http://mu.semte.ch/graphs/contacthub/accounts"
    links:
      - triplestore:database
    restart: always
    logging: *default-logging

  scope-of-operation:
    # The werkingsgebied of an organisation, as in OP: the label and the municipalities of a
    # scope, and one location for a set of locations (an existing one, or a composed one it
    # creates in the public graph, with mu-auth-sudo). The frontend calls it in the creation and
    # change-event forms; see config/dispatcher/dispatcher.ex. It is the one writer of the public
    # graph besides the change-request service: see the exception in config/authorization/config.lisp.
    image: lblod/scope-of-operation-service:0.2.0
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  kbo-data-sync:
    # The KBO data of an organisation (ext:KboOrganisatie, the "Gegevens uit KBO" of the
    # kerngegevens page) from Wegwijs, as in OP: the frontend posts /kbo-data-sync/<structured
    # identifier> after a save with a KBO number, and the service heals every organisation with a
    # KBO number nightly (CRON_PATTERN). It writes the organisation graph with mu-auth-sudo: see
    # the exceptions in config/authorization/config.lisp. The dispatcher routes /kbo-data-sync.
    image: lblod/sync-wegwijs-organization-service:2.0.5
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  search:
    # mu-search, for the organisations overview (/search/organizations): one index, the
    # organisations as a logged-in session reads them (config/search/config.json). The
    # delta-notifier keeps it up to date (config/delta/rules.js); after a change of the search
    # configuration or a migration of organisation data, rebuild it (see the README).
    image: semtech/mu-search:0.12.1
    volumes:
      - ./config/search:/config
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  elasticsearch:
    # Elasticsearch 9, the backend of mu-search. It does not run as root: ./data/elasticsearch
    # must exist and be writable by uid 1000 before the first start (see the README).
    image: semtech/mu-search-elastic-backend:1.3.1
    volumes:
      - ./data/elasticsearch/:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  change-requests:
    # Every edit of organisation data goes through this service (POST /change-requests); see
    # the "Change requests" section of the README and config/authorization/config.lisp.
    # 0.2.0 is the first release with the validation flow; it is published from the service's
    # master once its PR #2 is merged (see the deploy notes in CHANGELOG.md). Until then run the
    # stack with docker-compose.dev.yml, which mounts a checkout of ../change-request-service.
    image: lblod/change-request-service:0.2.0
    environment:
      DEFAULT_MU_AUTH_SCOPE: "http://services.lblod.info/change-request-service"
      APPLICATION_GRAPH: "http://mu.semte.ch/graphs/administrative-unit"
      CONFIG_FILE: "/config/change-requests/change-requests.json"
    volumes:
      - ./config/change-requests:/config/change-requests:ro
      - ./config/resources:/config/resources:ro
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  project-scripts:
    image: semtech/simple-script-store:1.0.0
    volumes:
      - ./config/project-scripts/:/app/scripts/
    restart: "no"
    labels:
      - "logging=true"
    logging: *default-logging

  ################################################################################
  # DELTA PRODUCER
  ################################################################################

  publication-triplestore:
    # The triplestore the producer publishes into, as in OP: it holds the
    # publication graph and the delta files' metadata, never the source data.
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: "http://mu.semte.ch/application"
    volumes:
      - ./data/publication-triplestore:/data
      - ./config/publication-triplestore/virtuoso.ini:/data/virtuoso.ini
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  jobs-controller:
    # Runs the tasks of a job in the order config/jobs-controller/config.json gives for its
    # operation. It has no dispatcher route: the delta-notifier feeds it the job's status changes.
    image: lblod/job-controller-service:0.7.0
    links:
      - database:database
    volumes:
      - ./config/jobs-controller/:/config/
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  delta-producer-publication-graph-maintainer:
    # Keeps the publication graph in step with the changes on the graphs the export reads, and
    # writes a delta file for each change. It serves those files: the dispatcher routes
    # /sync/public-organization-data/files to it.
    image: lblod/delta-producer-publication-graph-maintainer:1.4.3
    environment:
      MAX_BODY_SIZE: "50mb"
      PRETTY_PRINT_DIFF_JSON: "true"
      PUBLICATION_VIRTUOSO_ENDPOINT: "http://publication-triplestore:8890/sparql"
      PUBLICATION_MU_AUTH_ENDPOINT: "http://publication-triplestore:8890/sparql"
      SUDO_QUERY_RETRY_FOR_HTTP_STATUS_CODES: "404,500,503"
      CONFIG_SERVICES_JSON_PATH: "/config/publication-graph-maintainer/config.json"
    volumes:
      - ./config/delta-producer:/config
      - ./data/files/:/share
    links:
      - database:database
      - triplestore:virtuoso
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  delta-producer-background-jobs-initiator:
    # Starts the producer's healing, dump-creation and initial-sync jobs (config/delta-producer/
    # background-jobs-initiator/config.json) on their cron patterns.
    image: lblod/delta-producer-background-jobs-initiator:1.0.1
    environment:
      JOB_TIMEOUT_MINUTES: 1380 # 23h
    volumes:
      - ./config/delta-producer/background-jobs-initiator:/config
    links:
      - database:database
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  delta-producer-dump-file-publisher:
    # Writes the dump file of a dump-creation or initial-sync job to ./data/files.
    image: lblod/delta-producer-dump-file-publisher:0.10.3
    volumes:
      - ./config/delta-producer/dump-file-publisher:/config
      - ./data/files:/share
    links:
      - database:database
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
