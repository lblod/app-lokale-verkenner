x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  identifier:
    image: semtech/mu-identifier:1.11.0
    environment:
      SESSION_COOKIE_SECURE: "on"
    labels:
      - "logging=true"
    logging: *default-logging

  dispatcher:
    image: semtech/mu-dispatcher:2.1.1
    volumes:
      - ./config/dispatcher:/config
    labels:
      - "logging=true"
    logging: *default-logging

  # Your extra services here
  resource:
    image: semtech/mu-cl-resources:1.27.2
    volumes:
      - ./config/resources:/config
    labels:
      - "logging=true"
    logging: *default-logging

  migrations:
    image: semtech/mu-migrations-service:0.9.0
    links:
      - triplestore:database
    environment:
      MU_SPARQL_TIMEOUT: 600
    volumes:
      - ./config/migrations:/data/migrations
    labels:
      - "logging=true"
    logging: *default-logging

  delta-notifier:
    image: semtech/mu-delta-notifier:0.4.0
    volumes:
      - ./config/delta:/config/
    labels:
      - "logging=true"
    logging: *default-logging

  database:
    image: semtech/sparql-parser:0.0.15
    volumes:
      - ./config/authorization/:/config/
      - ./data/authorization/:/data/
    labels:
      - "logging=true"
    logging: *default-logging

  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
    volumes:
      - ./data/db:/data
      - ./config/virtuoso/virtuoso.ini:/data/virtuoso.ini
    labels:
      - "logging=true"
    logging: *default-logging

  login:
    image: lblod/acmidm-login-service:0.12.1.rc-2
    environment:
      MU_APPLICATION_AUTH_USERID_CLAIM: ""
      MU_APPLICATION_GRAPH: ""
      MU_APPLICATION_AUTH_ROLE_CLAIM: ""
      MU_APPLICATION_AUTH_DISCOVERY_URL: ""
      MU_APPLICATION_AUTH_CLIENT_ID: ""
      MU_APPLICATION_AUTH_REDIRECT_URI: ""
      MU_APPLICATION_AUTH_CLIENT_SECRET: ""
      ORGANIZATION_TYPE: "http://www.w3.org/ns/org#Organization"
      GROUP_TYPE_LABEL: "organizations"

  accountdetail:
    image: lblod/account-detail-service:0.1.0
    labels:
      - "logging=true"
    environment:
      MU_APPLICATION_GRAPH: "http://mu.semte.ch/graphs/contacthub/accounts"
    links:
      - triplestore:database
    restart: always
    logging: *default-logging

  project-scripts:
    image: semtech/simple-script-store:1.0.0
    volumes:
      - ./config/project-scripts/:/app/scripts/
    restart: "no"
    labels:
      - "logging=true"
    logging: *default-logging
