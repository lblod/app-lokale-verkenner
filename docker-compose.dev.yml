services:
  identifier:
    ports:
      - "88:80"
  triplestore:
    ports:
      - "8899:8890"

  mocklogin:
    image: lblod/mock-login-service:0.7.0
    environment:
      GROUP_TYPE: "http://www.w3.org/ns/org#Organization"
    links:
      - triplestore:database
    restart: "no"

  login:
    restart: "no"

  accountdetail:
    restart: "no"

  change-requests:
    image: semtech/mu-javascript-template:1.9.1
    environment:
      NODE_ENV: "development"
      # the template image does not carry the ENV of the service's Dockerfile
      MAX_BODY_SIZE: "5mb"
    volumes:
      - ../change-request-service:/app
    restart: "no"

  kbo-data-sync:
    restart: "no"

  search:
    restart: "no"

  elasticsearch:
    restart: "no"
