services:
  identifier:
    ports:
      - "88:80"
  triplestore:
    ports:
      - "8899:8890"

  mocklogin:
    image: lblod/mock-login-service:0.7.0
    environment:
      GROUP_TYPE: "http://www.w3.org/ns/org#Organization"
    links:
      - triplestore:database
    restart: "no"

  login:
    restart: "no"

  accountdetail:
    restart: "no"

  # Local development imports an OP dump, so the seed migrations for units,
  # bodies and codelists stay out of the way. Compose replaces a service's
  # volumes list, so this single mount is the whole override.
  migrations:
    volumes:
      - ./config/migrations-local:/data/migrations
